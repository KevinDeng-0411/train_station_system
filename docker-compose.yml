version: '3.8'

services:
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: train_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: train_station_db
      MYSQL_USER: trainuser
      MYSQL_PASSWORD: train123456
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - train_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: train_backend
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_PORT: 3306
      SPRING_DATASOURCE_DATABASE: train_station_db
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/train_station_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
    ports:
      - "8080:8080"
    volumes:
      - ./mysql/backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - train_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: train_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - train_network

  # 数据库可视化管理工具（轻量级，单PHP文件）
  adminer:
    image: adminer:latest
    container_name: train_adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: '2'
      ADMINER_PLUGINS: 'tables-filter'
    depends_on:
      - mysql
    networks:
      - train_network

  # phpMyAdmin - 自带 Designer 交互式 ER 图工具
  # 端口: 8082
  # 包含完整的数据库浏览器 + 可拖拽的ER图设计器
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: train_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    depends_on:
      - mysql
    networks:
      - train_network

  # SchemaSpy - 自动生成 ER 图报告
  # 输出到 docs/erd/ 目录，可下载 index.html 在浏览器打开
  schemaspy:
    image: schemaspy/schemaspy:latest
    container_name: train_schemaspy
    volumes:
      - ./docs/erd:/output
    command: >
      -t mysql
      -host mysql:3306
      -db train_station_db
      -s train_station_db
      -u root
      -p root123456
      -norowprogress
      -cat '%'
    depends_on:
      - mysql
    networks:
      - train_network

networks:
  train_network:
    driver: bridge

volumes:
  mysql_data:
